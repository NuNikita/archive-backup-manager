name: Test build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: archive_test
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archive -d archive_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://archive:integration-test-password@localhost:5432/archive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install backup engine
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit and integration tests
        run: go test -race -v ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Go application
        run: go build -o bin/backup-manager ./cmd/backup-manager
  containers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Generate isolated test credentials
        run: python3 scripts/setup.py
      - name: Build and start all five services
        run: docker compose up --build --wait --wait-timeout 120
      - name: Test backup restore and repository integrity
        run: python3 scripts/smoke_test.py
      - name: Show service status
        if: always()
        run: docker compose ps -a
      - name: Show diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove temporary CI containers and data
        if: always()
        run: docker compose down --volumes
  image:
    if: github.event_name != 'pull_request'
    needs: [test, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coursework
    steps:
      - name: Deploy immutable image to prepared Swarm manager
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          image="ghcr.io/${REPOSITORY,,}:${REVISION}"
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" /opt/archive/scripts/deploy.sh "$image"
