name: archive
x-environment: &environment
  DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD:?Run scripts/setup.py}@db:5432/archive?sslmode=disable
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup.py}
  VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Run scripts/setup.py}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Run scripts/setup.py}
  RESTIC_REPOSITORY: rest:http://storage:8000/coursework/
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
services:
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app: {condition: service_healthy}
    networks: [edge, backend]
    restart: unless-stopped
  app:
    build: .
    image: archive-manager:local
    environment: *environment
    volumes: ["./demo-data:/sources:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [backend]
    restart: unless-stopped
  worker:
    build: .
    image: archive-manager:local
    command: ["worker"]
    user: "0:0"
    environment:
      <<: *environment
      STAGE_SOURCES: "true"
    volumes: ["./demo-data:/sources:ro", "restores:/restores"]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    restart: unless-stopped
  storage:
    image: restic/rest-server:0.14.0
    environment:
      DISABLE_AUTHENTICATION: "true"
      OPTIONS: "--listen :8000 --path /data"
    volumes: ["repository:/data"]
    networks: [backend]
    restart: unless-stopped
networks:
  edge: {}
  backend: {internal: true}
volumes:
  database: {}
  repository: {}
  restores: {}
