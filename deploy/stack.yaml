version: "3.8"
x-environment: &environment
  DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD}@db:5432/archive?sslmode=disable
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  VIEWER_PASSWORD: ${VIEWER_PASSWORD}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD}
  RESTIC_REPOSITORY: rest:http://storage:8000/coursework/
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
services:
  proxy:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.archive_edge == true"]
      restart_policy: {condition: any, delay: 5s}
  app:
    image: ${APP_IMAGE}
    environment: *environment
    volumes: ["/opt/archive/demo-data:/sources:ro"]
    networks: [backend]
    deploy:
      replicas: 2
      placement:
        constraints: ["node.labels.archive_data == true"]
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: start-first, failure_action: rollback}
  worker:
    image: ${APP_IMAGE}
    command: ["worker"]
    user: "0:0"
    environment: *environment
    volumes: ["/opt/archive/demo-data:/sources:ro", "restores:/restores"]
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.archive_data == true"]
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: stop-first}
    stop_grace_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.archive_data == true"]
      restart_policy: {condition: any, delay: 5s}
  storage:
    image: restic/rest-server:0.14.0
    environment:
      DISABLE_AUTHENTICATION: "true"
      OPTIONS: "--listen :8000 --path /data"
    volumes: ["repository:/data"]
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.archive_data == true"]
      restart_policy: {condition: any, delay: 5s}
configs:
  nginx:
    file: ./nginx.conf
networks:
  backend:
    driver: overlay
    driver_opts: {encrypted: "true"}
    internal: true
volumes:
  database: {}
  repository: {}
  restores: {}
